name: t10-process-probe

on:
  push:
    branches: [t10/process-broker-proposal]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Probe atomic start attach interactive
        shell: bash
        run: |
          set -euo pipefail
          probe_dir=$(mktemp -d)
          trap 'podman rm -f hx-probe-atomic >/dev/null 2>&1 || true; rm -rf "$probe_dir"' EXIT
          cat >"$probe_dir/main.go" <<'EOF'
          package main
          import ("bufio"; "fmt"; "os")
          func main() {
            if !bufio.NewScanner(os.Stdin).Scan() { os.Exit(65) }
            fmt.Fprintln(os.Stdout, "out")
            fmt.Fprintln(os.Stderr, "err")
            os.Exit(9)
          }
          EOF
          cat >"$probe_dir/Containerfile" <<'EOF'
          FROM scratch
          COPY probe /probe
          USER 1000:1000
          ENTRYPOINT ["/probe"]
          EOF
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -o "$probe_dir/probe" "$probe_dir/main.go"
          podman build --pull=never -t localhost/hx-process-atomic:run -f "$probe_dir/Containerfile" "$probe_dir"
          digest=$(podman image inspect --format '{{.Digest}}' localhost/hx-process-atomic:run)
          ref="localhost/hx-process-atomic@$digest"
          cid=$(podman create --interactive --name hx-probe-atomic "$ref")
          mkfifo "$probe_dir/in"
          timeout 10s podman wait --condition exited "$cid" >"$probe_dir/wait" &
          wait_pid=$!
          set +e
          timeout 10s podman start --attach --interactive --sig-proxy=false "$cid" \
            <"$probe_dir/in" >"$probe_dir/out" 2>"$probe_dir/err" &
          attach_pid=$!
          exec 3>"$probe_dir/in"
          printf 'go\n' >&3
          exec 3>&-
          wait "$attach_pid"
          attach_rc=$?
          wait "$wait_pid"
          wait_rc=$?
          set -e
          printf 'PROBE atomic_attach_rc=%s wait_rc=%s wait=%q stdout=%q stderr=%q\n' \
            "$attach_rc" "$wait_rc" "$(cat "$probe_dir/wait")" \
            "$(cat "$probe_dir/out")" "$(cat "$probe_dir/err")"
          [[ "$attach_rc" -eq 0 ]]
          [[ "$wait_rc" -eq 0 ]]
          [[ "$(cat "$probe_dir/wait")" == 9 ]]
          [[ "$(cat "$probe_dir/out")" == out ]]
          [[ "$(cat "$probe_dir/err")" == err ]]
